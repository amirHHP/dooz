<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-def" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <pattern id="grid-def" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#64748b" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-def)"/>
  <rect width="100%" height="100%" fill="url(#grid-def)"/>
  <rect x="30" y="30" width="740" height="540" rx="16" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.3"/>
  
  <g transform="translate(400, 240)">
    <!-- Measuring Tape & Scissors Icon -->
    <circle cx="0" cy="0" r="70" fill="#0d9488" fill-opacity="0.1"/>
    <!-- Scissors -->
    <path d="M -25 -25 L 25 25 M -25 25 L 25 -25" stroke="#0d9488" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-35" cy="-35" r="15" fill="none" stroke="#0d9488" stroke-width="5"/>
    <circle cx="-35" cy="35" r="15" fill="none" stroke="#0d9488" stroke-width="5"/>
  </g>
  
  <g transform="translate(400, 390)" text-anchor="middle">
    <text y="0" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900">دوز • استودیو الگوسازی</text>
    <text y="32" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14">الگوی پارامتریک استاندارد</text>
  </g>
</svg>